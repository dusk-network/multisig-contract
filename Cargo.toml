[workspace]
resolver = "2"
members = ["types", "contract", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
multisig-contract-types = { path = "./types", version = "=0.1.0" }

dusk-core = "1"
dusk-vm = "1"
rusk-recovery = { version = "1", default-features = false }
tempfile = "3.13.0"
toml = "0.8.19"

bytecheck = { version = "0.6.12", default-features = false }
rkyv = { version = "0.7.39", default-features = false, features = [
	"size_32",
	"alloc",
	"validation",
] }

rand = "0.8.5"
bs58 = "0.5.1"
dusk-bytes = "0.1.7"
